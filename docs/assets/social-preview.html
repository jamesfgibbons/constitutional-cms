<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Constitutional CMS</title>
  <style>
    html, body { margin: 0; padding: 0; width: 1280px; height: 640px; overflow: hidden; }
    body {
      background: #0b0d10;
      color: #e8eaed;
      font-family: "SF Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 88px;
      box-sizing: border-box;
    }
    .kicker {
      color: #8b919a;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 15px;
      margin: 0 0 28px;
    }
    h1 {
      margin: 0;
      font-weight: 560;
      font-size: 46px;
      line-height: 1.22;
      letter-spacing: -0.02em;
      max-width: 18em;
    }
    .rule {
      width: 72px;
      height: 2px;
      background: #c4a574;
      margin: 36px 0;
    }
    .meta {
      color: #8b919a;
      font-size: 16px;
    }
    .meta strong { color: #e8eaed; font-weight: 560; }
  </style>
</head>
<body>
  <p class="kicker">Constitutional CMS</p>
  <h1>Govern what agents publish.<br />Prove it with a receipt.</h1>
  <div class="rule"></div>
  <p class="meta">v0.5.0 · Apache-2.0 · <strong>certified: false</strong></p>
</body>
</html>
