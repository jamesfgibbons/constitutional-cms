# Travel Intelligence - Enrichment Stage Contracts

stages:
  - name: price_collection
    description: "Collect flight prices from pricing API"
    writes_to: price_observations
    owner: agent_1
    schedule: "0 1 * * *"
    quality_gate:
      - "carrier is not 'Various' or 'Unknown'"
      - "price_usd > 0 AND price_usd < 50000"
      - "trip_type in ['round_trip', 'one_way']"
      - "route exists in the tracked route registry"
    cost_per_run: "$0.00"

  - name: ops_ingestion
    description: "Operational and environmental signals for each route"
    writes_to: operational_data
    owner: agent_1
    schedule: "*/30 * * * *"
    quality_gate:
      - "source_timestamp within last 2 hours"
      - "location_code passes source validation"
    cost_per_run: "$0.00"

  - name: route_snapshot
    description: "Materialize complete route state from all sources"
    reads_from: [price_observations, operational_data]
    writes_to: route_state_snapshots
    owner: agent_1
    schedule: "*/5 * * * *"
    quality_gate:
      - "normalized state scores each between 0.0 and 1.0"
      - "classification label is in the approved taxonomy"
      - "snapshot.updated_at < staleness_threshold"

  - name: intelligence_views
    description: "SQL materialized views for booking analysis"
    reads_from: price_observations
    writes_to: intelligence_views
    owner: agent_1
    schedule: "0 3 * * *"
    quality_gate:
      - "min_observations >= 30 for statistical significance"
      - "date ranges span at least 14 days"

  - name: narrative_enrichment
    description: "LLM-generated route intelligence briefs"
    reads_from: route_state_snapshots
    writes_to: route_narratives
    owner: agent_5
    schedule: "0 4 * * *"
    quality_gate:
      - "word_count >= 800"
      - "entity_density >= 3 named entities"
      - "no confabulated prices (all $ amounts from snapshot)"
      - "voice is analytical, not promotional"
    cost_per_run: "$0.05/route"
