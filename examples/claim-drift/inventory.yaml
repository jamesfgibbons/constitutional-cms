    permitted_projections: [html, api]
  - claim_id: claim:ccms.evaluator.offline
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: evaluator_network_access
    value: false
    polarity: denies
