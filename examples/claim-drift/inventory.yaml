# Nominated material-assertion inventory for the Claim Drift pilot.
# Approximately 20 assertions. Mix of owned Constitutional CMS facts
# and synthetic Harbor Ledger plan / pricing / comparison cases.
#
# Extraction proposes. These records are not authoritative product state.

pack_id: claim-drift
provenance_mode: mixed
as_of_default: "2026-10-09T16:00:00Z"
evaluation_clock_note: Explicit fixture input. Never wall clock.

entities:
  - id: product:constitutional-cms
    type: product
    lifecycle: {state: active, terminal: false}
    indexability: index
    owner: constitutional-cms-maintainers
  - id: product:harbor-ledger
    type: product
    lifecycle: {state: active, terminal: false}
    indexability: index
    owner: harbor-docs
    note: Synthetic vendor used for plan, price, and comparison cases.

