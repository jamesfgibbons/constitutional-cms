assertions:
  - claim_id: claim:ccms.receipts.never-truth
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: attest_integrity_not_truth
    value: true
    polarity: affirms
    claim_type: other
    claim_kind: product_capability
    scope: {release_stage: ga}
    assertion_text: Receipts attest integrity and policy conformance, never truth.
    required_qualifications: []
    supporting_evidence: [ev:ccms-claim-gate]
    source_authority_policy: product_documentation
    owner: constitutional-cms-maintainers
    permitted_projections: [html, sales_answer, api]
    expected_by_users: true
  - claim_id: claim:ccms.release.v0.5.0-published
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: latest_published_release
    value: v0.5.0
    polarity: affirms
    claim_type: other
    claim_kind: release_status
    scope: {release_stage: ga, product_version: "0.5.0"}
    assertion_text: v0.5.0 is the latest published release as of 2026-08-22.
    supporting_evidence: [ev:ccms-changelog]
    source_authority_policy: product_documentation
    owner: constitutional-cms-maintainers
    permitted_projections: [html, sales_answer, api]
  - claim_id: claim:ccms.catalog.nineteen-checks
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: catalog_check_count
    value: "19"
    polarity: affirms
    claim_type: metric
    claim_kind: product_capability
    scope: {product_version: "0.5.0"}
    assertion_text: CheckCatalogV1 1.0.2 contains 19 checks.
    supporting_evidence: [ev:ccms-changelog]
    source_authority_policy: product_documentation
    owner: constitutional-cms-maintainers
    permitted_projections: [html, api]
  - claim_id: claim:ccms.audit.receipt-first
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: audit_exit_means_receipt
    value: true
    polarity: affirms
    claim_type: other
    claim_kind: product_capability
    scope: {release_stage: ga}
    assertion_text: Default audit success means a receipt was generated, not that publication is allowed.
    supporting_evidence: [ev:ccms-changelog]
    source_authority_policy: product_documentation
    owner: constitutional-cms-maintainers
    permitted_projections: [html, sales_answer, api]
  - claim_id: claim:ccms.claim-gate.not-in-v0.5.0
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: claim_gate_release_status
    value: draft_on_main
    polarity: affirms
    claim_type: other
    claim_kind: release_status
    scope: {release_stage: draft, product_version: main}
    assertion_text: Claim Gate v0.1 is draft on main and is not a released v0.5.0 feature.
    supporting_evidence: [ev:ccms-claim-gate]
    source_authority_policy: product_documentation
    owner: constitutional-cms-maintainers
    permitted_projections: [html, sales_answer, api]
    required_qualifications: ["draft on main", "not a released v0.5.0 feature"]
  - claim_id: claim:ccms.cli.not-compiler
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: is_site_compiler
    value: false
    polarity: denies
    claim_type: other
    claim_kind: product_capability
    assertion_text: The public CLI is not a site compiler.
    supporting_evidence: [ev:ccms-changelog]
    source_authority_policy: product_documentation
    owner: constitutional-cms-maintainers
    permitted_projections: [html, sales_answer, api]
  - claim_id: claim:ccms.license.apache-2.0
    assertion_version: "1"
    issuer: constitutionalcms.com
    subject: product:constitutional-cms
    predicate: license
