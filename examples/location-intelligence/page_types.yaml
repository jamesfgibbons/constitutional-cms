# Location Intelligence - Page Type Contracts
# Example based on a location monitoring platform

location_page:
  description: "Intelligence page for a specific location in the monitored network"
  url_pattern: "/locations/{location-slug}"
  
  tiers:
    FULL:
      required_fields:
        - primary_metric
        - supporting_entities[] # at least one active related entity
        - state_duration
        - narrative_block       # LLM-generated intelligence brief, 800+ words
        - json_ld_faq           # FAQ schema from deterministic sources
        - json_ld_profile       # Profile schema
        - insight_summary       # Deterministic insight recommendation
      min_word_count: 800
      schema_emission: true
      internal_links: true
      sitemap_priority: 0.8
      
    BASIC:
      required_fields:
        - primary_metric
        - supporting_entities[]
        - state_duration
      min_word_count: 200
      schema_emission: true
      internal_links: true
      sitemap_priority: 0.6
      
    SHELL:
      required_fields:
        - location_code
        - location_name
        - region_code
        - region_name
      min_word_count: 0
      schema_emission: false
      internal_links: false
      noindex: true
      sitemap_priority: 0.1
      
    SUPPRESS:
      trigger: "Location has no valid observations in 180+ days"
      action: "Remove from sitemap, return 404"

  degradation_rules:
    - condition: "primary_metric is null OR last_observation > 14 days"
      action: "degrade to SHELL"
    - condition: "narrative_block is null OR narrative_word_count < 800"
      action: "cap at BASIC (cannot reach FULL)"
    - condition: "supporting_entities[] is empty"
      action: "degrade to SHELL"

region_page:
  description: "Aggregate page for all monitored locations in a region"
  url_pattern: "/regions/{region-slug}"
  
  tiers:
    FULL:
      required_fields:
        - region_name
        - child_locations[]     # at least 10 active location pages
        - highlighted_count     # number of locations with standout status
        - narrative_block
      min_word_count: 400
      schema_emission: true
      internal_links: true
      
    BASIC:
      required_fields:
        - region_name
        - child_locations[]     # at least 3 active location pages
      min_word_count: 100
      schema_emission: true
      internal_links: true
      
    SHELL:
      required_fields:
        - region_name
      schema_emission: false
      internal_links: false

analysis_page:
  description: "Analysis page for timing and pattern shifts around a location"
  url_pattern: "/locations/{location-slug}/analysis"
  
  tiers:
    FULL:
      required_fields:
        - timing_pattern_analysis    # from SQL intelligence view
        - interval_comparison        # from SQL intelligence view
        - seasonal_variation         # from SQL intelligence view
        - min_observations: 30       # need statistical significance
      min_word_count: 600
      schema_emission: true
      
    BASIC:
      required_fields:
        - timing_pattern_analysis
        - min_observations: 10
      min_word_count: 200
      schema_emission: true
      
    SHELL:
      required_fields:
        - location_code
        - region_code
      schema_emission: false
      noindex: true
