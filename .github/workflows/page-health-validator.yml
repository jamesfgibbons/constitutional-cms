name: Page Health Validator

on:
  pull_request:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate contracts
        run: python scripts/validate_contracts.py

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Run observe-only sample report
        run: |
          python scripts/page_health_validator.py \
            --input tests/fixtures/page_health_observe.csv \
            --out-dir reports/page-health-validator

      - name: Upload observe-only report
        uses: actions/upload-artifact@v4
        with:
          name: page-health-validator-report
          path: reports/page-health-validator
