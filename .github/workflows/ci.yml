name: Framework CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-validation:
    name: contract-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate contracts
        run: python scripts/validate_contracts.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  page-health-observer:
    name: page-health-observer
    needs: contract-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate observe-only sample report
        run: |
          python scripts/page_health_validator.py \
            --input tests/fixtures/page_health_observe.csv \
            --out-dir reports/page-health-validator

      - name: Upload observe-only report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-health-validator-report
          path: reports/page-health-validator
          retention-days: 7
