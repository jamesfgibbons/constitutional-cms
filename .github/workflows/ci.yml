name: Framework CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-validation:
    name: contract-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate contracts
        run: python scripts/validate_contracts.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  page-health-observer:
    name: page-health-observer
    needs: contract-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate observe-only sample report
        run: |
          python scripts/page_health_validator.py \
            --input tests/fixtures/page_health_observe.csv \
            --out-dir reports/page-health-validator

      - name: Upload observe-only report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: page-health-validator-report
          path: reports/page-health-validator
          retention-days: 7
