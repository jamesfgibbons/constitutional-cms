# Mobile Table Card Layout Contract
# Prevents generated table-like surfaces from collapsing on narrow screens.

version: "1.0.0"
status: "observe"
purpose: >
  Govern responsive behavior for repeated tabular records generated by agents,
  especially when labels, numbers, links, or status badges would become unreadable
  in a narrow table.

applies_to:
  - comparison_tables
  - metric_tables
  - entity_lists
  - pricing_or_score_boards
  - audit_report_tables

breakpoints:
  narrow_viewport_max_width_px: 480

rules:
  - id: table_like_surfaces_become_cards
    description: "At narrow widths, table-like records must render as cards, grids, or stacked blocks instead of compressed columns."
    enforcement: observe
    severity: P2

  - id: labels_remain_attached_to_values
    description: "When a row becomes a card, each value must retain a visible or accessible label."
    enforcement: observe
    severity: P2

  - id: no_per_character_columns
    description: "Responsive layout must not force words or numbers into one-character columns."
    enforcement: observe
    severity: P1

  - id: animation_belongs_to_readouts
    description: "Motion effects should apply to values or readouts, not to navigation or ticker chrome."
    enforcement: observe
    severity: P3

validator_inputs:
  viewport_width: "Rendered viewport width in pixels"
  component_family: "Declared component family"
  layout_mode: "table | card | grid | block | unknown"
  overflow_detected: "Whether rendered content exceeds the viewport"
  min_cell_width_px: "Smallest rendered cell width, if known"

promotion_requirements:
  - "At least two clean observe runs"
  - "A negative control that proves the check fails when the layout is deliberately broken"
  - "Documented selectors or component families for the surfaces under validation"
