schema_version: StandardsRegistryV1
status: normative
last_verified: "2026-08-15"

authority_classes:
  external_standard:
    description: A formal standard published by a recognized standards body.
    may_block_stable_conformance: true
  platform_guidance:
    description: Published behavior or eligibility guidance from a named platform.
    may_block_stable_conformance: true
    limitation: Compliance never guarantees crawling, indexing, ranking, citation, or inclusion.
  constitutional_rule:
    description: A portable Constitutional CMS invariant with falsifiable evidence.
    may_block_stable_conformance: true
  experimental:
    description: An emerging practice or draft that may change without compatibility guarantees.
    may_block_stable_conformance: false

sources:
  wcag_2_2:
    authority_class: external_standard
    title: Web Content Accessibility Guidelines (WCAG) 2.2
    publisher: W3C
    version: "2.2"
    url: https://www.w3.org/TR/WCAG22/
  core_web_vitals_2025:
    authority_class: platform_guidance
    title: Core Web Vitals thresholds
    publisher: Google web.dev
    version: "2025-05-07"
    url: https://web.dev/articles/defining-core-web-vitals-thresholds
  google_search_technical:
