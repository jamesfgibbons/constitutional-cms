    title: Google Search technical requirements
    publisher: Google Search Central
    version: current
    url: https://developers.google.com/search/docs/essentials/technical
  google_ai_search:
    authority_class: platform_guidance
    title: Optimizing for generative AI features on Google Search
    publisher: Google Search Central
    version: current
    url: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
  robots_rfc_9309:
    authority_class: external_standard
    title: Robots Exclusion Protocol
    publisher: IETF
    version: RFC 9309
    url: https://www.ietf.org/rfc/rfc9309.pdf
  schema_org_30:
